<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فيلق مدجاي AK7</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:#0a0a0f;color:#fff;display:flex;min-height:100vh}
        .sidebar{width:80px;background:rgba(255,255,255,0.03);backdrop-filter:blur(10px);padding:30px 0;display:flex;flex-direction:column;align-items:center;border-left:1px solid rgba(0,212,255,0.2)}
        .sidebar .logo{font-size:2rem;color:#fbbf24;margin-bottom:40px}
        .sidebar nav a{color:#94a3b8;font-size:1.5rem;display:block;margin:20px 0;transition:0.3s;text-decoration:none}
        .sidebar nav a:hover{color:#00d4ff}
        .main{flex:1;padding:30px}
        .header h1{font-size:1.8rem;background:linear-gradient(135deg,#fbbf24,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;margin:30px 0}
        .stat-card{background:rgba(20,20,35,0.7);padding:20px;border-radius:16px;border-right:4px solid #00d4ff}
        .stat-card .num{font-size:2.2rem;font-weight:900;color:#00d4ff}
        .stat-card .label{color:#94a3b8;font-size:0.8rem}
        .two-col{display:grid;grid-template-columns:1fr 1.5fr;gap:30px}
        .glass{background:rgba(20,20,35,0.7);padding:25px;border-radius:20px}
        input,textarea{width:100%;padding:12px;background:rgba(0,0,0,0.4);border:1px solid #333;border-radius:12px;color:#fff;margin:8px 0;font-family:inherit;outline:none}
        input:focus,textarea:focus{border-color:#00d4ff}
        .btn{width:100%;padding:14px;background:linear-gradient(135deg,#00d4ff,#a855f7);border:none;border-radius:14px;color:#000;font-weight:900;font-size:1.1rem;cursor:pointer}
        .history-item{background:rgba(0,0,0,0.2);padding:12px;border-radius:12px;margin:8px 0;border-right:3px solid #00d4ff;display:flex;justify-content:space-between;align-items:center}
        .history-item small{color:#94a3b8}
        .toast{position:fixed;bottom:20px;left:20px;background:#1a1a2e;padding:12px 24px;border-radius:12px;border:1px solid #00d4ff}
        @media(max-width:768px){.sidebar{display:none}.two-col{grid-template-columns:1fr}}
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo">𓂀</div>
    <nav>
        <a href="#"><span style="font-size:1.2rem;">⚡</span></a>
        <a href="#"><span style="font-size:1.2rem;">📊</span></a>
        <a href="#"><span style="font-size:1.2rem;">📜</span></a>
    </nav>
</aside>

<div class="main">
    <header class="header">
        <h1>⫷ فيلق مدجاي AK7 ⫸</h1>
    </header>

    <div class="stats">
        <div class="stat-card"><div class="label">📦 الإجمالي</div><div class="num" id="total">0</div></div>
        <div class="stat-card"><div class="label">📅 اليوم</div><div class="num" id="today">0</div></div>
        <div class="stat-card"><div class="label">📆 الأسبوع</div><div class="num" id="week">0</div></div>
        <div class="stat-card"><div class="label">📈 الشهر</div><div class="num" id="month">0</div></div>
    </div>

    <div class="two-col">
        <div class="glass">
            <h3 style="color:#00d4ff;">📝 إبلاغ جديد</h3>
            <form id="form">
                <input type="email" id="email" placeholder="✉️ البريد الإلكتروني" required />
                <input type="text" id="subject" placeholder="🏷️ الموضوع" required />
                <textarea id="msg" rows="4" placeholder="✏️ اكتب الرسالة..." required></textarea>
                <button type="submit" class="btn">🚀 إرسال البلاغ</button>
            </form>
        </div>
        <div class="glass">
            <h3 style="color:#00d4ff;">📋 سجل البلاغات</h3>
            <input type="text" id="search" placeholder="🔍 بحث..." style="margin-bottom:10px" />
            <div id="history"></div>
        </div>
    </div>
</div>

<script>
// ===== التخزين المحلي =====
let reports = JSON.parse(localStorage.getItem('ak7_reports') || '[]');

// بيانات تجريبية لو مفيش حاجة
if (reports.length === 0) {
    reports = [
        { email: 'anubis@medjay.eg', subject: 'خلل في الدرع الذهبي', msg: 'الدرع لا يستجيب للترددات', date: Date.now() - 3600000 },
        { email: 'horus@pharaoh.eg', subject: 'تحديث نظام العين', msg: 'العين اليمنى لا ترى الأشعة', date: Date.now() - 7200000 }
    ];
    localStorage.setItem('ak7_reports', JSON.stringify(reports));
}

function saveReports() {
    localStorage.setItem('ak7_reports', JSON.stringify(reports));
}

function renderStats() {
    const now = new Date();
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay()).getTime();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

    let total = reports.length;
    let today = 0, week = 0, month = 0;

    reports.forEach(r => {
        const d = new Date(r.date).getTime();
        if (d >= todayStart) today++;
        if (d >= weekStart) week++;
        if (d >= monthStart) month++;
    });

    document.getElementById('total').textContent = total;
    document.getElementById('today').textContent = today;
    document.getElementById('week').textContent = week;
    document.getElementById('month').textContent = month;
}

function renderHistory(filter = '') {
    let data = reports;
    if (filter.trim() !== '') {
        const q = filter.trim().toLowerCase();
        data = reports.filter(r => 
            r.email.toLowerCase().includes(q) || 
            r.subject.toLowerCase().includes(q) || 
            r.msg.toLowerCase().includes(q)
        );
    }
    data.sort((a, b) => b.date - a.date);

    const container = document.getElementById('history');
    if (data.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8;text-align:center;padding:20px;">📭 لا توجد بلاغات</p>';
        return;
    }

    let html = '';
    data.forEach(r => {
        const d = new Date(r.date);
        const time = d.toLocaleDateString('ar-EG') + ' ' + d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        html += `
            <div class="history-item">
                <div>
                    <strong style="color:#00d4ff;">${r.email}</strong><br>
                    <small style="color:#94a3b8;">${r.subject}</small>
                </div>
                <small>${time}</small>
            </div>
        `;
    });
    container.innerHTML = html;
}

function renderAll() {
    renderStats();
    renderHistory(document.getElementById('search').value);
}

// ===== إرسال النموذج =====
document.getElementById('form').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const msg = document.getElementById('msg').value.trim();

    if (!email || !subject || !msg) {
        alert('⚠️ يرجى ملء جميع الحقول!');
        return;
    }
    if (!email.includes('@')) {
        alert('⚠️ البريد الإلكتروني غير صالح!');
        return;
    }

    reports.push({ email, subject, msg, date: Date.now() });
    saveReports();
    renderAll();
    this.reset();
    alert('✅ تم إرسال البلاغ بنجاح!');
});

// ===== البحث =====
document.getElementById('search').addEventListener('input', function() {
    renderHistory(this.value);
});

// ===== تحميل البيانات =====
renderAll();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⫷ فِــيْلَــقُ مِــدْجَــايْ 𓂀⃝☥ ⫸ 𝐀𝐊7</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== ROOT VARIABLES (اللمسة الذهبية + النيون) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121b;
            --bg-card: rgba(20, 20, 35, 0.75);
            --border-glow: rgba(0, 212, 255, 0.3);
            --neon-blue: #00d4ff;
            --neon-purple: #a855f7;
            --gold-egypt: #fbbf24;
            --gold-glow: rgba(251, 191, 36, 0.4);
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --shadow-neon: 0 0 30px rgba(0, 212, 255, 0.15);
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }
        /* ===== خلفية متحركة خفيفة (موجات + شبكة) ===== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, #1a1a3e 0%, #0a0a0f 80%);
            overflow: hidden;
        }
        .bg-animation::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
        }
        @keyframes gridMove {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(60px, 60px) rotate(2deg);
            }
        }
        .bg-animation::after {
            content: '𓂀';
            position: absolute;
            bottom: 10%;
            right: 5%;
            font-size: 25rem;
            color: rgba(251, 191, 36, 0.04);
            font-family: 'Orbitron', sans-serif;
            transform: rotate(15deg);
            pointer-events: none;
        }
        /* ===== SIDEBAR (الجانب الأيمن - لأننا عربي) ===== */
        .sidebar {
            width: 90px;
            height: 100vh;
            position: sticky;
            top: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(0, 212, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            z-index: 100;
            flex-shrink: 0;
            transition: 0.3s;
        }
        .sidebar .logo-icon {
            font-size: 2.8rem;
            color: var(--gold-egypt);
            text-shadow: 0 0 30px var(--gold-glow);
            margin-bottom: 40px;
            font-family: 'Orbitron', sans-serif;
            line-height: 1;
        }
        .sidebar .logo-icon small {
            display: block;
            font-size: 0.5rem;
            color: var(--neon-blue);
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--neon-blue);
        }
        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 30px;
            flex: 1;
        }
        .sidebar nav a {
            color: var(--text-dim);
            font-size: 1.6rem;
            transition: 0.3s;
            position: relative;
            cursor: pointer;
        }
        .sidebar nav a:hover,
        .sidebar nav a.active {
            color: var(--neon-blue);
            text-shadow: 0 0 20px var(--neon-blue);
            transform: scale(1.1);
        }
        .sidebar nav a span {
            position: absolute;
            right: -70px;
            background: var(--bg-secondary);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-weight: 600;
            transition: 0.2s;
        }
        .sidebar nav a:hover span {
            opacity: 1;
            right: -80px;
        }
        .sidebar .version {
            font-size: 0.6rem;
            color: var(--text-dim);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
            width: 100%;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }
        /* ===== MAIN CONTENT ===== */
        .main-wrapper {
            flex: 1;
            padding: 30px 40px 40px 40px;
            max-width: calc(100% - 90px);
        }
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-egypt), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }
        .header h1 i {
            -webkit-text-fill-color: initial;
            color: var(--gold-egypt);
            margin-left: 10px;
            font-size: 2rem;
        }
        .header .sub-title {
            font-size: 0.9rem;
            color: var(--text-dim);
            background: var(--glass-bg);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(0, 212, 255, 0.1);
            backdrop-filter: blur(5px);
        }
        .header .sub-title i {
            color: var(--neon-blue);
            margin-left: 8px;
        }

        /* ===== STATS CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }
        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px 25px;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-neon);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--neon-blue), var(--gold-egypt));
            border-radius: 0 4px 4px 0;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-blue);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
        }
        .stat-card .label {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
        .stat-card .number {
            font-size: 2.5rem;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #fff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .stat-card .icon-bg {
            position: absolute;
            left: 10px;
            bottom: 10px;
            font-size: 3.5rem;
            opacity: 0.05;
            color: var(--neon-blue);
        }

        /* ===== FORM & HISTORY GRID ===== */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        @media (max-width: 992px) {
            .two-col {
                grid-template-columns: 1fr;
            }
            .main-wrapper {
                padding: 20px;
                max-width: 100%;
            }
            .sidebar {
                width: 70px;
                padding: 15px 0;
            }
            .sidebar nav a span {
                display: none;
            }
        }

        /* ===== FORM ===== */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow-neon);
        }
        .glass-card h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--neon-blue);
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .glass-card h3 i {
            color: var(--gold-egypt);
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 5px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            transition: 0.3s;
            outline: none;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.15);
            background: rgba(0, 0, 0, 0.6);
        }
        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }
        .progress-area {
            margin: 20px 0;
        }
        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue), var(--gold-egypt));
            border-radius: 10px;
            transition: 0.6s ease;
            box-shadow: 0 0 20px var(--neon-blue);
        }
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 5px;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            border-radius: 16px;
            color: #0a0a0f;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }
        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.6);
        }
        .btn-submit:active {
            transform: scale(0.98);
        }

        /* ===== HISTORY TABLE ===== */
        .history-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .history-actions input {
            flex: 1;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            outline: none;
            min-width: 150px;
        }
        .history-actions input:focus {
            border-color: var(--neon-blue);
        }
        .history-actions button {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-dim);
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }
        .history-actions button:hover {
            background: var(--neon-blue);
            color: #000;
            border-color: var(--neon-blue);
        }
        .history-scroll {
            max-height: 350px;
            overflow-y: auto;
            padding-left: 5px;
        }
        .history-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .history-scroll::-webkit-scrollbar-thumb {
            background: var(--neon-blue);
            border-radius: 10px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 14px;
            margin-bottom: 8px;
            border-right: 3px solid var(--neon-blue);
            transition: 0.2s;
            flex-wrap: wrap;
            gap: 10px;
        }
        .history-item:hover {
            background: rgba(0, 212, 255, 0.05);
            border-right-color: var(--gold-egypt);
        }
        .history-item .info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }
        .history-item .info .email {
            font-weight: 700;
            color: var(--neon-blue);
            font-size: 0.9rem;
        }
        .history-item .info .subject {
            color: var(--text-dim);
            font-size: 0.8rem;
        }
        .history-item .time {
            font-size: 0.65rem;
            color: var(--text-dim);
            font-family: 'Orbitron', sans-serif;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 12px;
            border-radius: 50px;
        }
        .empty-msg {
            text-align: center;
            color: var(--text-dim);
            padding: 40px 0;
            font-size: 0.9rem;
        }
        .empty-msg i {
            font-size: 3rem;
            display: block;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 9999;
        }
        .toast {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--neon-blue);
            padding: 15px 30px;
            border-radius: 16px;
            color: #fff;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.3);
            font-weight: 600;
            margin-top: 10px;
            animation: slideUp 0.4s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .toast i {
            color: var(--gold-egypt);
            font-size: 1.4rem;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== FOOTER ===== */
        .footer-brand {
            margin-top: 30px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 25px;
            letter-spacing: 1px;
        }
        .footer-brand span {
            color: var(--gold-egypt);
            font-weight: 800;
            font-family: 'Orbitron', sans-serif;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .stat-card .number {
                font-size: 1.6rem;
            }
            .header h1 {
                font-size: 1.2rem;
            }
            .header .sub-title {
                font-size: 0.7rem;
                padding: 4px 12px;
            }
            .sidebar {
                display: none;
            }
            .main-wrapper {
                max-width: 100%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== الخلفية ===== -->
    <div class="bg-animation"></div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <div class="logo-icon">
            𓂀
            <small>AK7</small>
        </div>
        <nav>
            <a class="active" title="لوحة التحكم"><i class="fas fa-chart-pie"></i><span>لوحة التحكم</span></a>
            <a title="البلاغات"><i class="fas fa-file-alt"></i><span>البلاغات</span></a>
            <a title="التاريخ"><i class="fas fa-history"></i><span>التاريخ</span></a>
            <a title="الإعدادات"><i class="fas fa-cog"></i><span>إعدادات</span></a>
        </nav>
        <div class="version">v3.0 𓂀</div>
    </aside>

    <!-- ===== MAIN ===== -->
    <div class="main-wrapper">

        <!-- HEADER -->
        <header class="header">
            <h1><i class="fas fa-crown"></i> ⫷ فِــيْلَــقُ مِــدْجَــايْ 𓂀⃝☥ ⫸ 𝐀𝐊7</h1>
            <div class="sub-title"><i class="fas fa-bolt"></i> النظام السايبر الفرعوني | Online</div>
        </header>

        <!-- STATS -->
        <section class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="label"><i class="fas fa-database"></i> إجمالي البلاغات</div>
                <div class="number" id="totalCount">0</div>
                <div class="icon-bg"><i class="fas fa-layer-group"></i></div>
            </div>
            <div class="stat-card">
                <div class="label"><i class="fas fa-calendar-day"></i> اليوم</div>
                <div class="number" id="todayCount">0</div>
                <div class="icon-bg"><i class="fas fa-sun"></i></div>
            </div>
            <div class="stat-card">
                <div class="label"><i class="fas fa-calendar-week"></i> هذا الأسبوع</div>
                <div class="number" id="weekCount">0</div>
                <div class="icon-bg"><i class="fas fa-calendar-alt"></i></div>
            </div>
            <div class="stat-card">
                <div class="label"><i class="fas fa-calendar-month"></i> هذا الشهر</div>
                <div class="number" id="monthCount">0</div>
                <div class="icon-bg"><i class="fas fa-moon"></i></div>
